server {
    # Only root can listen on ports below 1024, we use higher-numbered ports
    # since nginx is running under non-root user hive
    listen 8080;

    server_name localhost;
    root /usr/share/nginx/html;

    # Logging to the mounted volume for outside container access
    access_log /usr/src/app/log/nginx_access_spatialquery-service.log;
    error_log /usr/src/app/log/nginx_error_spatialquery-service.log warn;

    # Pass requests to the uWSGI server using the "uwsgi" protocol on port 5000
    location / {
        # Always enable CORS
        # Response to preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;

            # These are permitted headers to be used with the actual request
            add_header 'Access-Control-Allow-Headers' 'Authorization, Cache-Control, Content-Type' always;

            # Cache the response to this preflight request in browser for the max age 86400 seconds (= 24 hours)
            add_header 'Access-Control-Max-Age' 86400 always;

            # No Content
            return 204;
        }

        # Response to the original requests with CORS enabled
        if ($request_method = GET) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Cache-Control, Content-Type' always;
        }

        include uwsgi_params;
        uwsgi_pass uwsgi://localhost:5000;

        # Maximum time nginx will wait to establish a connection to the uwsgi upstream
        uwsgi_connect_timeout 10s;
        # Requests load a ~1 GB h5ad and run 30 to 45 seconds or more, so the timeouts are generous
        uwsgi_send_timeout    300s;
        uwsgi_read_timeout    300s;
        # Size of the buffer used to read the first part of the uwsgi response header
        uwsgi_buffer_size 32k;
        # Number and size of buffers used for reading the uwsgi response body
        uwsgi_buffers 4 32k;
    }

}