services:

  spatialquery-service:
    hostname: spatialquery-service
    container_name: spatialquery-service
    ports:
      - "3334:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    build:
      # Build context holds the Dockerfile, nginx files and the staged copy of app/
      # (copied in by docker-development.sh before building)
      context: ./spatialquery-service
    environment:
      # UID and GID 1001 to match the hive user by default
      - HOST_GID=${HOST_GID:-1001}
      - HOST_UID=${HOST_UID:-1001}
    init: true
    restart: always
    sysctls:
      # Set to 512 to match uwsgi.ini listen = 512
      net.core.somaxconn: 512
    volumes:
      # Mount the app config to container in order to keep it outside of the image
      - "../app/instance:/usr/src/app/app/instance"
      # Mount the logging to container
      - "../log:/usr/src/app/log"
      # Mount conf.d on host machine to the nginx conf.d on container
      - "./spatialquery-service/nginx/conf.d:/etc/nginx/conf.d"
      # Read-only mount of the PSC file system. Same path inside the container,
      # so the paths ingest-api returns resolve without translation.
      - "/hive:/hive:ro"
    networks:
      - gateway_hubmap

networks:
  # This is the network created by gateway to enable communication between multiple docker-compose projects
  gateway_hubmap:
    external: true