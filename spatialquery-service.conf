# Provisional nginx config for the gateway. 
# Lots of these are just assumptions and will need to be tweaked depending on the 
# Actual configuration when this service gets deployed. 
# For example, the ssl cert paths are based on the current hubmap psc gateway but likely will need changed

server {
    listen 8080;
    server_name spatialquery.dev.hubmapconsortium.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 4430 ssl;
    server_name spatialquery.dev.hubmapconsortium.org;
    root /usr/share/nginx/html;
    #these cert paths likely need changed
    ssl_certificate /etc/letsencrypt/live/gateway.dev.hubmapconsortium.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.dev.hubmapconsortium.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /usr/src/app/log/nginx_access_spatialquery-service.log;
    error_log /usr/src/app/log/nginx_error_spatialquery-service.log warn;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    location / {
        # Response to preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Cache-Control, Content-Type' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        # Response to the original requests with CORS enabled
        if ($request_method = GET) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Cache-Control, Content-Type' always;
        }

        # No auth_request: authentication is handled by @secured in the service itself
        include uwsgi_params;
        uwsgi_pass uwsgi://spatialquery-service:5000;
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
        uwsgi_param UWSGI_SCHEME $scheme;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
    }
}