[uwsgi]
# So uwsgi knows where to mount the app
chdir = /usr/src/app/app

# Application's callable
module = wsgi:application

# Delegate the logging to the master process
# Send logs to stdout so docker picks them up
log-master=true

# Master with worker processes.
# Each request loads a ~1 GB h5ad into memory, so keep this low.
# Re-evaluate after measuring peak memory per request.
master = true
processes = 4

# Recycle each worker after this many requests
max-requests = 2000

# Enable multithreading within uWSGI.
# One thread per worker: the analysis is CPU-bound, so extra threads add no speed.
enable-threads = True
threads = 1

# Socket for the gateway nginx (all interfaces, so other containers can connect)
socket = :5000

# Enable socket cleanup when process stops
vacuum = true

# Ensure compatibility with init system
die-on-term = true

# OS-level socket listen backlog
listen = 512

# Enables the uwsgi stats server on port 9191, exposing a JSON endpoint with
# real-time worker and queue metrics (including per-worker memory) for diagnostics
stats = localhost:9191

# Makes the stats server accessible via HTTP rather than a raw socket,
# allowing standard tools like curl to query it
stats-http = true